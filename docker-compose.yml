services:
  push-gateway:
    build: .
    ports:
      - "127.0.0.1:8181:8080"
    volumes:
      - ./ctdata:/data
    environment:
      - PUSH_GATEWAY_DID=${PUSH_GATEWAY_DID:-did:web:push.example.org}
      - PUSH_GATEWAY_PORT=8080
      - SQLITE_PATH=/data/push-gateway.db
      - JETSTREAM_URL=${JETSTREAM_URL:-wss://jetstream2.us-east.bsky.network/subscribe}
      - EXPO_PUSH_ACCESS_TOKEN=${EXPO_PUSH_ACCESS_TOKEN}
      - DEV_MODE=false
      - FCM_SERVICE_ACCOUNT_PATH=${FCM_SERVICE_ACCOUNT_PATH}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

